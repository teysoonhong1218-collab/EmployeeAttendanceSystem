{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ title }}</h1>
</div>

<div class="card" style="max-width: 600px;">
    <div class="card-body">
        <form method="POST" novalidate>
            {{ form.hidden_tag() }}

            <div class="mb-3">
                <label class="form-label">{{ form.name.label.text }}</label>
                {{ form.name(class="form-control") }}
                {% for error in form.name.errors %}
                <div class="text-danger small mt-1">{{ error }}</div>
                {% endfor %}
            </div>

            <div class="mb-3">
                <label class="form-label">{{ form.description.label.text }}</label>
                {{ form.description(class="form-control") }}
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i>{{ form.submit.label.text }}
                </button>
                <a href="{{ url_for('department_list') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
